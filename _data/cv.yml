    Research Experience:
      - company: Materials Design and Process Engineering Laboratory, Sogang University
        period: "25.12 – present"
        position: Undergraduate Researcher
        location: Seoul, South Korea
        summary: "Advised by Prof. Heonjae Jeong."
        highlights:
          - "**Origin of Negative Photoconductivity in Amorphous ZnON** (2/2026 – 8/2026) — performed hybrid DFT (PBE0) and AIMD calculations on amorphous ZnON to determine the origin of negative photoconductivity; traced it to two coexisting trap channels, N 2p-derived hole localization and low-coordination Zn-derived electron localization, and quantified their trap energies at the valence and conduction band edges."
          - "**Thermodynamic Stability of Doped LLZO Solid-Electrolyte Interfaces** (7/2026 – present) — evaluating interfacial thermodynamic stability and Li-ion conductivity of Al-, Ga-, Ta- and Sr+Ta-doped LLZO solid electrolytes at the LiSi anode and FeF₃ cathode interfaces for thermal-battery applications, assessing dopant-dependent phase stability and Li-ion transport at realistic operating conditions (500 °C) with first-principles calculations and a machine-learning interatomic potential."
          - "**Synthesis of Fluoride-Ion Solid Electrolytes Derived from Inverse Design** (8/2026 – present) — benchmarking the group's first experimental workflow by synthesizing β-PbSnF₄ and validating its ionic conductivity against reference values before attempting inverse-design candidate compositions."

