    Technical Projects:
      - name: Monitoring and Logging Tools for Multi-Server VASP Calculations
        period: "26.07 – 26.09"
        highlights:
          - "Developed a Bash resource monitor reporting per-GPU utilization and per-user job allocation on a shared Linux server"
          - "Built job launchers that check GPU/core availability and flag conflicts before VASP runs, now used by the group"
          - "Automated result logging and alerts by parsing VASP outputs for convergence, energy, and run settings, then sending them to Google Sheets and Telegram via REST APIs across three compute servers"

      - name: Computational Pre-Screening for Area-Selective ALD
        period: "26.03 – 26.06"
        summary: "Manufacturing Process — Top 5 report, selected for class presentation"
        highlights:
          - "Investigated area-selective ALD as a bottom-up alternative to top-down etching, where edge placement errors limit 3D transistor patterning"
          - "Proposed VASP-based pre-screening of substrate–inhibitor pairs to cut experimental time and cost, demonstrated with acetylacetone, which adsorbs on Al₂O₃ but not on SiO₂ (hydroxylated slabs)"

      - name: Automated Robotic Arm Teleoperation System
        period: "26.03 – 26.06"
        highlights:
          - "Developed a motion-driven robotic arm system capable of real-time teleoperation, aimed at automating repetitive lab experiments and manual labor tasks"
          - "Streamlined the motor control and teleoperation pipeline by integrating the LeRobot package, replacing traditional hard-coding methods"

      - name: Analysis for Aramid-Hybrid CFRP Fishing Rod
        period: "25.09 – 25.12"
        summary: "Fundamentals of Engineering Materials"
        highlights:
          - "Showed in LS-DYNA that replacing the outermost CFRP ply of a tapered rod tube with aramid (AFRP) increases steel-sphere impact energy absorption by 130% and shifts failure from brittle fragmentation to ductile deformation"
          - "Proposed the CFRP–AFRP hybrid layup, with a TiO₂ UV-protective coating for the aramid, to keep fishing rods reliable in harsh conditions: intense sunlight, salt exposure, and temperature swings"

      - name: Weather-Aware Navigation Using Estimated Arrival Times
        period: "25.08 – 25.12"
        summary: "C Programming Basic"
        highlights:
          - "Built a C navigation tool that estimates when a driver will reach each point on a route and shows the weather forecast for that point at that time, rather than a single snapshot at departure"
          - "Integrated navigation, map, and Korea Meteorological Administration forecast APIs, matching estimated arrival times to hourly forecasts and sampling weather every 5 km along the route on an interactive map"

