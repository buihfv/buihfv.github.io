      # 아래 name은 _research/ 문서의 title과 정확히 같아야 자동으로 링크가 걸린다.
      - name: Thermodynamic Stability of Doped LLZO Solid-Electrolyte Interfaces
        period: "7/2026 – present"
        sub: true
        highlights:
          - "Constructed interface structures of Al-, Ga-, Ta-, and Sr+Ta-doped LLZO solid electrolytes with the Li₁₃Si₄ anode and FeF₃ cathode for thermal-battery applications"
          - "Evaluating the interfacial thermodynamic stability and Li-ion conductivity of each doped LLZO solid electrolyte at these interfaces"

      - name: Fluoride-Ion Solid Electrolyte Synthesis Toward Inverse-Designed Compositions
        period: "8/2026 – present"
        sub: true
        highlights:
          - "Benchmarking the group's first experimental workflow by synthesizing β-PbSnF₄ and validating its ionic conductivity against reference values before attempting inverse-design candidate compositions"

      - name: Origin of Negative Photoconductivity in Amorphous ZnON
        period: "2/2026 – 8/2026"
        sub: true
        highlights:
          - "Constructed amorphous ZnON (a-ZnON) by replicating the experimental sputtering process, using Gaussian, Packmol, and AIMD simulations with EDS-derived composition data"
          - "Performed hybrid DFT (PBE0) calculations on a-ZnON to obtain accurate electronic structures"
          - "Identified negative photoconductivity as originating from two coexisting trap channels — N 2p-derived hole localization and low-coordination Zn-derived electron localization — and quantified their trap energies at the valence/conduction band edges"

