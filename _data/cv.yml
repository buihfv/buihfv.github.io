    Technical Projects:
      - name: Computational Workflow Automation for VASP
        period: "26.07 – 26.09"
        highlights:
          - "Built a GPU utilization monitor for a shared external compute server, reporting per-GPU load and per-user occupancy."
          - "Filled a monitoring gap left by the HPC scheduler, giving the group a way to check load before submitting jobs."
          - "Added automated logging of calculation parameters, outputs, and completion/failure notifications across three compute servers."
          - "*Skills:* Python, Linux/Bash, REST APIs."

      - name: "Area-Selective ALD: A Computational Screening Approach"
        period: "26.03 – 26.06"
        summary: "Manufacturing Processes"
        highlights:
          - "Surveyed the limitations of conventional deposition methods and examined area-selective ALD as an emerging solution, along with its deposition mechanism."
          - "Introduced first-principles (VASP) high-throughput screening as a computational tool that evaluates precursor–substrate interactions prior to experimental deposition, reducing cost while increasing throughput."
          - "Illustrated the approach with a toy model comparing reaction energies of two precursor–substrate systems, distinguishing an energetically unfavorable case from one in which deposition stabilizes the system."
          - "*Skills:* VASP, DFT, ALD process analysis."

      - name: Automated Robotic Arm Teleoperation System
        period: "26.03 – 26.06"
        highlights:
          - "Developed a motion-driven robotic arm system capable of real-time teleoperation, aimed at automating repetitive lab experiments and manual labor tasks."
          - "Streamlined the motor control and teleoperation pipeline by integrating the LeRobot package, replacing traditional hard-coding methods."
          - "*Skills:* LeRobot package, computer vision, Linux, Autodesk Inventor, 3D printing."

      - name: Structural and Thermal Evaluation of Composite Fishing Rod Materials
        period: "25.09 – 25.12"
        summary: "Fundamentals of Engineering Materials (course project)"
        highlights:
          - "Investigated whether combining two composite materials could improve the elastic and structural performance of a fishing rod, using ANSYS simulation."
          - "Performed an impact analysis by varying the velocity of a steel ball striking the rod structure to determine the load threshold at failure, showing an improvement over a conventional single-material design."
          - "Conducted a supplementary thermal analysis to evaluate the thermal expansion coefficients of the composite materials across the temperature range relevant to marine field conditions."
          - "*Skills:* ANSYS (structural and thermal analysis), composite materials."

      - name: Predictive Weather Navigation System
        period: "25.08 – 25.12"
        summary: "C Programming Basic"
        highlights:
          - "Developed a dynamic route-planning application in C that predicts weather conditions at specific waypoints along a route."
          - "Synchronized spatial coordinates from a navigation API with temporal data from a meteorological API."
          - "Engineered a data processing pipeline to extract, parse, and integrate raw external datasets into a functional format."
          - "*Skills:* C, REST APIs (navigation and weather)."

      - name: Design and Fabrication of a Linear-Actuator Camera Tracking Slider
        period: "25.03 – 25.06"
        summary: "Machine Production Practice"
        highlights:
          - "Designed a linear-rail camera slider frame using 3D CAD, built from an aluminum block and bolted joints."
          - "Selected and mounted a linear actuator motor to drive the camera along the rail."
          - "Implemented Arduino-based motor control to regulate actuator speed, direction, and reciprocating motion for smooth camera tracking shots."
          - "*Skills:* 3D CAD, Arduino."

